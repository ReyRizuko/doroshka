name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: pip install -r music-server/requirements.txt
      - name: Check API syntax
        run: python -m py_compile music-server/app.py

  native-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native Kotlin application
        working-directory: native-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: doroshka-native-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
