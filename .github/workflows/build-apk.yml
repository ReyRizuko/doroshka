name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]
jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: pip install -r music-server/requirements.txt
      - name: Check backend syntax
        run: python -m py_compile music-server/app.py
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p www scripts
          if [ -f index.html ]; then mv index.html www/index.html; fi
          if [ -f prepare.js ]; then mv prepare.js scripts/prepare.js; fi
          ls -R www scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: node scripts/prepare.js
      - name: Check application JavaScript and provider panels
        run: node scripts/check-inline-js.js
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure native playback and Spotify deep link
        run: python3 native-setup.py
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dorozhka-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
