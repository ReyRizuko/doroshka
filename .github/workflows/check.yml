name: Application checks

on:
  push:
    branches: [feat/multisource-ui]
  pull_request:
    branches: [feat/multisource-ui]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
